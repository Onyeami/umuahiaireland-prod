<!-- Dynamic Breadcrumb Navigation -->
{% if not is_public_page or current_namespace %}
<nav class="bg-gray-50 border-b border-gray-200 px-6 py-3" aria-label="Breadcrumb">
  <ol class="flex items-center space-x-2 text-sm">
    <!-- Home/Dashboard Link -->
    <li>
      <a href="{% if is_admin_page %}{% url 'admin:dashboard' %}{% elif is_user_page %}{% url 'user:dashboard' %}{% else %}{% url 'app:home_page' %}{% endif %}"
        class="text-gray-500 hover:text-gray-700 transition-colors">
        {% if is_admin_page %}
        <i class="fas fa-tachometer-alt mr-1"></i>Admin Dashboard
        {% elif is_user_page %}
        <i class="fas fa-user mr-1"></i>Dashboard
        {% else %}
        <i class="fas fa-home mr-1"></i>Home
        {% endif %}
      </a>
    </li>

    <!-- Separator -->
    {% if page_title and page_title != 'Dashboard' and page_title != 'Home' %}
    <li>
      <i class="fas fa-chevron-right text-gray-400 text-xs"></i>
    </li>

    <!-- Current Page -->
    <li>
      <span class="text-gray-900 font-medium">{{ page_title }}</span>
    </li>
    {% endif %}
  </ol>
</nav>
{% endif %}
