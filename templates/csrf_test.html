<!DOCTYPE html>
<html>
<head>
    <title>CSRF Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test-form { max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        input[type="text"], button { padding: 10px; margin: 5px 0; }
        .success { color: green; }
        .error { color: red; }
        .token-info { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>CSRF Test Page</h1>
    
    <div class="token-info">
        <strong>CSRF Token Info:</strong><br>
        Token: <code>{{ csrf_token }}</code>
    </div>
    
    <form class="test-form" method="post" action="">
        {% csrf_token %}
        <div class="form-group">
            <label for="test_data">Test Data:</label>
            <input type="text" id="test_data" name="test_data" value="Hello CSRF!" required>
        </div>
        <button type="submit">Test CSRF</button>
    </form>

    <h3>Browser Information:</h3>
    <div class="token-info">
        <strong>Cookies Enabled:</strong> <span id="cookies-status">Checking...</span><br>
        <strong>User Agent:</strong> <span id="user-agent"></span>
    </div>

    <script>
        // Check if cookies are enabled
        function testCookies() {
            document.cookie = "csrf_test=true; path=/";
            const cookieEnabled = document.cookie.indexOf("csrf_test=true") !== -1;
            document.getElementById('cookies-status').textContent = cookieEnabled ? 'Yes' : 'No';
            document.getElementById('cookies-status').className = cookieEnabled ? 'success' : 'error';
            
            // Clean up test cookie
            if (cookieEnabled) {
                document.cookie = "csrf_test=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            }
        }
        
        // Show user agent
        document.getElementById('user-agent').textContent = navigator.userAgent;
        
        // Test cookies on load
        testCookies();
    </script>
</body>
</html>
