{% extends "_admin/_base.html" %}
{% block content %}
<div class="container mx-auto py-8 px-4">
    <h1 class="text-2xl font-bold mb-6">Edit Member Image</h1>
    <form method="post" enctype="multipart/form-data" class="bg-white p-6 rounded shadow-md max-w-lg mx-auto">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="mt-4 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">Save Changes</button>
        <a href="{% url 'admin:members_gallery' %}" class="ml-4 text-blue-500">Back to Members Gallery</a>
    </form>
</div>
{% endblock %}
