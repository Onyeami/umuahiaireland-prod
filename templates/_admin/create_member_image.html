{% extends "_admin/_base.html" %}
{% block content %}
<div class="container mx-auto py-10 px-4">
    <h1 class="text-3xl font-bold mb-8 text-gray-800 text-center">Upload Member Image</h1>
    <form method="post" enctype="multipart/form-data" class="bg-white p-8 rounded-xl shadow-lg max-w-xl mx-auto border border-gray-200">
        {% csrf_token %}
        <div class="space-y-6">
            {% for field in form %}
                <div class="flex flex-col">
                    <label for="{{ field.id_for_label }}" class="mb-2 font-semibold text-gray-700">{{ field.label }}{% if field.field.required %}<span class="text-red-500">*</span>{% endif %}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="text-xs text-gray-500 mt-1">{{ field.help_text }}</span>
                    {% endif %}
                    {% for error in field.errors %}
                        <span class="text-xs text-red-500 mt-1">{{ error }}</span>
                    {% endfor %}
                </div>
            {% endfor %}
        </div>
        <div class="flex items-center justify-between mt-8">
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-semibold shadow hover:bg-blue-700 transition">Upload</button>
            <a href="{% url 'admin:members_gallery' %}" class="ml-4 text-blue-600 hover:underline">Back to Members Gallery</a>
        </div>
    </form>
</div>
{% endblock %}
